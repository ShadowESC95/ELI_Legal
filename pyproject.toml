[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-legal"
version = "0.8.2"
description = "Governed legal case preparation: evidence in, verified source-linked analysis out, a named human decides"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jason Fitzgibbon Bridgeman"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=4.2,<7",
  "eli-sdk @ https://github.com/ShadowESC95/eli-sdk/releases/download/v1.1.0/eli_sdk-1.1.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
]

gui = [
  "PySide6>=6.6",
]
# Runs GGUF model files in process with llama.cpp, as ELI v2 and v3 do. It is compiled on
# install where no prebuilt wheel exists, which needs CMake and a C/C++ compiler.
gguf = [
  "llama-cpp-python>=0.3",
]
# What a graphics pack (a complete llama.cpp for Python) imports from the environment it is
# loaded into. The source installers add it, so a pack runs where llama.cpp cannot be compiled.
packs = [
  "numpy>=1.20",
  "diskcache>=5.6.1",
  "jinja2>=2.11.3",
]
# Lets the server make its own certificate when none is supplied (OpenSSL is used otherwise).
server = [
  "cryptography>=42",
]
# What an installed copy ships with.
all = [
  "PySide6>=6.6",
  "cryptography>=42",
]
build = [
  "pyinstaller>=6.10",
]

[project.scripts]
eli-legal = "eli_legal.cli:main"

[project.gui-scripts]
eli-legal-gui = "eli_legal.gui.app:main"

# How ELI v3 finds this edition once the package is installed beside it.
[project.entry-points."eli.editions"]
legal = "eli_legal.edition:register"

# How ELI v3 finds ELI Legal as a bundle it can open in place of its own window.
[project.entry-points."eli.bundles"]
legal = "eli_legal.bundle:describe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eli_legal = [
  "config/*.json",
  "config/jurisdictions/*.json",
  "config/frameworks/*.json",
  "config/workflows/*.json",
  "edition/*.json",
  "edition/personas/*.json",
  "edition/templates/*.json",
  "evaluation/benchmark/*.json",
  "evaluation/benchmark/*.jsonl.gz",
  "governance/registers/*.csv",
  "governance/templates/*.md",
  "gui/assets/*.png",
  "web/*.html",
  "web/assets/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["eli_legal"]

[[tool.mypy.overrides]]
module = ["eli.*", "pypdf.*"]
ignore_missing_imports = true

# llama.cpp for Python is optional and untyped; its numpy stubs need a newer Python than ours.
[[tool.mypy.overrides]]
module = ["llama_cpp", "llama_cpp.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
