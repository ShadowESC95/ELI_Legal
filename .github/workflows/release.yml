# Build the installers for Linux, Windows and macOS when a version tag is pushed, and attach
# them to a draft release with their SHA-256 checksums. A person publishes the draft.
#
# Each job builds on the oldest runner image available, because a frozen build runs on that
# system and anything newer, not older.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 binutils
      - run: python -m pip install -e ".[all,build]"
      - run: PYTHON=python packaging/linux/build.sh
      - name: The installer installs, runs and uninstalls
        run: |
          sh dist/installers/ELI_Legal-*-linux-*.run --verify
          sh dist/installers/ELI_Legal-*-linux-*.run
          ~/.local/bin/eli-legal --version
          ~/.local/bin/eli-legal demo
          sh dist/installers/ELI_Legal-*-linux-*.run --uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/installers/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
        env:
          PYTHON: python
      - name: The frozen program runs the demonstration
        run: build\dist\eli-legal\eli-legal.exe demo
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/installers/*

  macos:
    strategy:
      matrix:
        runner: [macos-13, macos-14]  # Intel, Apple silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHON=python packaging/macos/build.sh
      - name: The frozen program runs the demonstration
        run: '"build/dist/ELI Legal.app/Contents/MacOS/eli-legal" demo'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/installers/*

  draft:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: cd installers && rm -f SHA256SUMS* && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft --title "ELI Legal $GITHUB_REF_NAME" --notes "Unsigned builds. Verify each download against SHA256SUMS before installing."
        env:
          GH_TOKEN: ${{ github.token }}
