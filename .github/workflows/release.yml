# Build the installers for Linux, Windows and macOS and attach them to a GitHub release.
#
#   On a version tag (v*):   build, test, and create a draft release with every installer.
#   Run by hand:             build and test only. Nothing is published. Use it to check the
#                            builds before tagging.
#
# Each job builds on the oldest runner image available, because a frozen build runs on that
# system and anything newer, not older.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # libxkbcommon-x11-0 and the xcb-util family: Qt's xcb plugin needs them, and a bundle that
      # carries libxkbcommon without libxkbcommon-x11 crashes on a key press (0.4.0)
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 libdbus-1-3 libfontconfig1 binutils curl file
      # eli-sdk is private: its wheel is fetched with a read-only token and checked against
      # its pinned SHA-256, and every pip install in this job finds it (PIP_FIND_LINKS).
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      - run: python -m pip install -e ".[all,build]"
      # GGUF support. Built for any x86-64 or ARM processor of its kind, not just this runner's,
      # and left out (with a note in the build log) if it will not build here. At the version
      # the graphics packs are built at: two versions' libraries cannot share a process.
      - run: python -m pip install "llama-cpp-python==$(python scripts/fetch_gpu_pack.py --version)" || echo "::warning::llama.cpp did not build; this installer will not run GGUF models"
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
      # The graphics pack shipped inside the installer, checked against its checksum.
      - run: python scripts/fetch_gpu_pack.py
      - run: PYTHON=python packaging/linux/build.sh
      # What the installers are built from, as a CycloneDX bill of materials published with the
      # release; and a known-vulnerability audit of what they ship (the build tools and test
      # tools are not shipped and not audited). A release is not built over a known, fixable
      # vulnerability (Cyber Resilience Act, Annex I Part II); an exception is allowed only with
      # its reason in packaging/audit_exceptions.txt. The tools run from an environment of their
      # own, so they are neither listed nor audited themselves.
      - name: Bill of materials and known-vulnerability audit
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet "cyclonedx-bom>=7,<10" "pip-audit>=2.7,<3"
          VERSION=$(python -c "import eli_legal; print(eli_legal.__version__)")
          "$RUNNER_TEMP/tools/bin/cyclonedx-py" environment --pyproject pyproject.toml \
            --mc-type application --of JSON \
            -o "dist/installers/ELI_Legal-$VERSION-sbom.cdx.json" "$(command -v python)"
          python -m pip freeze --exclude-editable \
            | grep -viE '^(pip|setuptools|wheel|pyinstaller|pyinstaller-hooks-contrib|altgraph|macholib|pefile)==' \
            | grep -v '^-e ' > "$RUNNER_TEMP/shipped.txt"
          IGNORE=$(grep -Ev '^\s*(#|$)' packaging/audit_exceptions.txt | awk '{print "--ignore-vuln " $1}')
          "$RUNNER_TEMP/tools/bin/pip-audit" -r "$RUNNER_TEMP/shipped.txt" --no-deps --disable-pip \
            --progress-spinner off --desc on $IGNORE
      # The built program needs a licence to start. The checks below use an ELI Legal key kept
      # as the ELI_LEGAL_CI_KEY secret, in a key folder of this run's own, thrown away with it.
      - name: A licence for the checks of the built program
        env:
          ELI_LEGAL_CI_KEY: ${{ secrets.ELI_LEGAL_CI_KEY }}
        run: |
          test -n "$ELI_LEGAL_CI_KEY" || { echo "::error::ELI_LEGAL_CI_KEY is not set: add an ELI Legal key as an Actions secret"; exit 1; }
          echo "ELI_KEYS_DIR=$RUNNER_TEMP/eli-keys" >> "$GITHUB_ENV"
          ELI_KEYS_DIR="$RUNNER_TEMP/eli-keys" eli-legal licence activate "$ELI_LEGAL_CI_KEY" > /dev/null
      - name: The installer installs, runs and uninstalls; the AppImage runs
        run: |
          sh dist/installers/ELI_Legal-*-linux-*.run --verify
          sh dist/installers/ELI_Legal-*-linux-*.run
          ~/.local/bin/eli-legal --version
          ~/.local/bin/eli-legal demo
          # the graphics pack is inside the installer, and the machine report runs without a card
          ~/.local/bin/eli-legal gpu status | tee /dev/stderr | grep -q '"vulkan-llama_cpp_python-'
          sh dist/installers/ELI_Legal-*-linux-*.run --uninstall
          dist/installers/ELI_Legal-*-linux-*.AppImage --appimage-extract-and-run --version
          dist/installers/ELI_Legal-*-linux-*.AppImage --appimage-extract-and-run demo
      - name: The desktop window opens and takes key presses
        run: |
          sudo apt-get install -y xvfb xdotool
          xvfb-run -a -s "-screen 0 1280x800x24" sh packaging/linux/window_smoke.sh dist/installers/ELI_Legal-*-linux-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3   # passed between the jobs of one run; the release keeps its own files
          name: linux
          path: |
            dist/installers/*
            !dist/installers/SHA256SUMS*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup, if the image does not already have it
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $found -and -not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
      # eli-sdk is private: its wheel is fetched with a read-only token and checked against
      # its pinned SHA-256, and every pip install in this job finds it (PIP_FIND_LINKS).
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      - run: python -m pip install -e ".[all,build]"
      - run: python -m pip install "llama-cpp-python==$(python scripts/fetch_gpu_pack.py --version)" ; if ($LASTEXITCODE -ne 0) { echo "::warning::llama.cpp did not build; this installer will not run GGUF models"; exit 0 }
        shell: pwsh
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
      - run: python scripts/fetch_gpu_pack.py
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
        env:
          PYTHON: python
      # The built program needs a licence to start. The checks below use an ELI Legal key kept
      # as the ELI_LEGAL_CI_KEY secret, in a key folder of this run's own, thrown away with it.
      - name: A licence for the checks of the built program
        shell: pwsh
        env:
          ELI_LEGAL_CI_KEY: ${{ secrets.ELI_LEGAL_CI_KEY }}
        run: |
          if (-not $env:ELI_LEGAL_CI_KEY) { echo "::error::ELI_LEGAL_CI_KEY is not set: add an ELI Legal key as an Actions secret"; exit 1 }
          "ELI_KEYS_DIR=$env:RUNNER_TEMP\eli-keys" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:ELI_KEYS_DIR = "$env:RUNNER_TEMP\eli-keys"
          eli-legal licence activate $env:ELI_LEGAL_CI_KEY | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the ELI_LEGAL_CI_KEY key was refused" }
      - name: The frozen program runs the demonstration
        run: build\dist\eli-legal\eli-legal.exe demo
      - name: The graphics pack is inside the program, and the machine report runs without a card
        shell: pwsh
        run: |
          $status = & build\dist\eli-legal\eli-legal.exe gpu status | Out-String
          Write-Host $status
          if ($status -notmatch 'vulkan-llama_cpp_python-') { throw "the graphics pack was not shipped" }
      - name: The setup program installs silently, runs and uninstalls
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\installers\*-setup.exe | Select-Object -First 1).FullName
          $target = "$env:RUNNER_TEMP\eli-legal-install"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$target`""
          & "$target\eli-legal.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the installed program does not start" }
          $uninstall = (Get-ChildItem "$target\unins*.exe" | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $uninstall -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if (Test-Path "$target\eli-legal.exe") { throw "the uninstaller left the program behind" }
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3   # passed between the jobs of one run; the release keeps its own files
          name: windows
          path: |
            dist/installers/*
            !dist/installers/SHA256SUMS*

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]  # Intel, Apple silicon (GitHub retired macos-14 in November 2026)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # cryptography (for the licence check) as a published wheel, which carries its own OpenSSL.
      # From 49 there is none for Intel Macs: built here it links the runner's OpenSSL, which the
      # bundle does not carry, and the program cannot check its licence (0.8.0).
      # eli-sdk is private: its wheel is fetched with a read-only token and checked against
      # its pinned SHA-256, and every pip install in this job finds it (PIP_FIND_LINKS).
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      - run: python -m pip install -e ".[all,build]" "cryptography<49" --only-binary cryptography
      # GGUF support. Built for any x86-64 or ARM processor of its kind, not just this runner's,
      # and left out (with a note in the build log) if it will not build here.
      - run: python -m pip install "llama-cpp-python==$(python scripts/fetch_gpu_pack.py --version)" || echo "::warning::llama.cpp did not build; this installer will not run GGUF models"
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
      - run: PYTHON=python packaging/macos/build.sh
      # The built program needs a licence to start. The checks below use an ELI Legal key kept
      # as the ELI_LEGAL_CI_KEY secret, in a key folder of this run's own, thrown away with it.
      - name: A licence for the checks of the built program
        env:
          ELI_LEGAL_CI_KEY: ${{ secrets.ELI_LEGAL_CI_KEY }}
        run: |
          test -n "$ELI_LEGAL_CI_KEY" || { echo "::error::ELI_LEGAL_CI_KEY is not set: add an ELI Legal key as an Actions secret"; exit 1; }
          echo "ELI_KEYS_DIR=$RUNNER_TEMP/eli-keys" >> "$GITHUB_ENV"
          ELI_KEYS_DIR="$RUNNER_TEMP/eli-keys" eli-legal licence activate "$ELI_LEGAL_CI_KEY" > /dev/null
      - name: The frozen program runs the demonstration
        run: '"build/dist/ELI Legal.app/Contents/MacOS/eli-legal" demo'
      - name: The machine report runs (the built-in llama.cpp uses the card through Metal)
        run: '"build/dist/ELI Legal.app/Contents/MacOS/eli-legal" gpu status'
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3   # passed between the jobs of one run; the release keeps its own files
          name: macos-${{ matrix.runner }}
          path: |
            dist/installers/*
            !dist/installers/SHA256SUMS*

  release:
    needs: [linux, windows, macos]
    # Publish what was built even if one platform failed, as long as Linux did not.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd installers && sha256sum -- * > SHA256SUMS && cat SHA256SUMS && cd ..
          {
            sed -e "s/@TAG@/$GITHUB_REF_NAME/g" packaging/release_notes.md
            echo
            echo "## Built in this run"
            echo
            echo "| Platform | Result |"
            echo "|---|---|"
            echo "| Linux | ${{ needs.linux.result }} |"
            echo "| Windows | ${{ needs.windows.result }} |"
            echo "| macOS | ${{ needs.macos.result }} |"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat installers/SHA256SUMS
            echo '```'
          } > notes.md
      # A re-run (after one platform failed) replaces the draft an earlier run made, so there
      # is one draft holding every installer. A published release is never touched.
      - run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft --title "ELI Legal $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
