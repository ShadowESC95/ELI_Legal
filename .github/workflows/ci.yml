name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Libraries Qt needs to start without a display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64 || \
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      # Tesseract and Poppler, so the tests read an image-only page by OCR as a user's machine
      # with them installed does (elsewhere those tests are skipped; the unread-page test runs).
      - name: OCR (Tesseract, Poppler)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils
      # eli-sdk is private: its wheel is fetched with a read-only token and checked against
      # its pinned SHA-256, and every pip install in this job finds it (PIP_FIND_LINKS).
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      # packs: what a graphics pack imports (Jinja among it, which fills in chat templates)
      # every package at the version in requirements.lock.txt: a new upstream release changes nothing here
      - run: python -m pip install -c requirements.lock.txt -e ".[dev,all,packs]"
      - run: python scripts/lock_dependencies.py --check
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
          # The real-browser test of the web application runs on one platform; the server's
          # behaviour is covered everywhere by tests/api.
          ELI_LEGAL_SKIP_BROWSER_TESTS: ${{ (runner.os != 'Linux' || matrix.python != '3.12') && '1' || '' }}
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src
      - run: python -m eli_legal.cli governance
      # The real probes of this runner (memory, graphics card, llama.cpp), on every system:
      # the tests give the probes their answers, this runs them.
      - run: python -m eli_legal.cli gpu status

  # The source installers themselves, run the way a user runs them on a clean machine of each
  # system: they make their own environment, add llama.cpp at the graphics packs' version, and
  # what they installed starts. The job above installs the package with pip and never runs them.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # eli-sdk is private: its wheel is fetched with a read-only token and checked against
      # its pinned SHA-256, and every pip install in this job finds it (PIP_FIND_LINKS).
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      - name: Install from source (Linux, macOS)
        if: runner.os != 'Windows'
        run: PYTHON=python ./install.sh
      - name: Install from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
      - name: What was installed runs, with llama.cpp at the packs' version (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ~/.local/bin/eli-legal --version
          ~/.local/bin/eli-legal demo
          ~/.local/bin/eli-legal gpu status | tee status.json
          python - <<'PY'
          import json, subprocess, sys
          want = subprocess.run([sys.executable, "scripts/fetch_gpu_pack.py", "--version"],
                                capture_output=True, text=True, check=True).stdout.strip()
          in_use = json.load(open("status.json"))["in_use"]
          assert in_use["available"] and in_use["version"] == want, (in_use, want)
          print("llama.cpp", want, "is installed and loads")
          PY
          QT_QPA_PLATFORM=offscreen ~/.local/opt/eli-legal-src/venv/bin/python -c "from PySide6.QtWidgets import QApplication; QApplication([]); print('window toolkit starts')"
      - name: What was installed runs, with llama.cpp at the packs' version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Eli = "$env:LOCALAPPDATA\Programs\ELI Legal (source)\eli-legal.cmd"
          & $Eli --version
          if ($LASTEXITCODE -ne 0) { throw "eli-legal did not start" }
          & $Eli demo
          if ($LASTEXITCODE -ne 0) { throw "the demonstration did not run" }
          $Status = (& $Eli gpu status | Out-String | ConvertFrom-Json)
          $Want = (python scripts/fetch_gpu_pack.py --version)
          if (-not $Status.in_use.available -or $Status.in_use.version -ne $Want) { throw "llama.cpp $Want is not installed: $($Status.in_use.summary)" }
          Write-Host "llama.cpp $Want is installed and loads"
          $env:QT_QPA_PLATFORM = "offscreen"
          & "$env:LOCALAPPDATA\Programs\ELI Legal (source)\venv\Scripts\python.exe" -c "from PySide6.QtWidgets import QApplication; QApplication([]); print('window toolkit starts')"
          if ($LASTEXITCODE -ne 0) { throw "the window toolkit did not start" }
      - name: It uninstalls and keeps the data (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ./install.sh --uninstall
          test ! -e ~/.local/opt/eli-legal-src && test ! -e ~/.local/bin/eli-legal
      - name: It uninstalls and keeps the data (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Programs\ELI Legal (source)") { throw "the program folder was left behind" }
