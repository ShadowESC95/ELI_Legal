name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Libraries Qt needs to start without a display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64 || \
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[dev,all]"
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
          # The real-browser test of the web application runs on one platform; the server's
          # behaviour is covered everywhere by tests/api.
          ELI_LEGAL_SKIP_BROWSER_TESTS: ${{ (runner.os != 'Linux' || matrix.python != '3.12') && '1' || '' }}
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src
      - run: python -m eli_legal.cli governance
